<link rel = "stylesheet" href = "../css/delete.css">
<div class="full-screen-container">
	<div class="main-page-container">
	

		<div data-ng-if = "UserVM.tipoBorrado == 0">
			<form data-ng-submit="UserVM.functions.deleteCurrentUser()">
				<label>Are you sure you want to delete your account?</label> 
				<input type="submit" value="Yes">
			</form>
			<a href="#!/UpdateUser">No, go back</a>
		</div>
	
   
		
			
	<div data-ng-if = "DetailsVM.tipoBorrado == 0">
		<div data-ng-if="DetailsVM.restaurant.idu == DetailsVM.currentUser.id">	
			<form data-ng-submit="DetailsVM.functions.deleteCurrentRestaurant()">
				<label>Are you sure you want to delete this restaurant?</label> 
				<input type="submit" value="Yes">
			</form>
			<a href="#!/UpdateRestaurant/{{ DetailsVM.restaurant.id }}">No,go back</a>
		</div>
		<div data-ng-if="DetailsVM.restaurant.idu != DetailsVM.currentUser.id">
			<div class="formulario_error">
				<h2 class="fuera"> No puedes eliminar un restaurante que no es tuyo </h2>
				<a href="#!/myRestaurants">Go back</a>
			</div>
		</div>
	</div> 	
	 
			
		
		
	<div data-ng-if = "DishVM.tipoBorrado == 0">
		<div data-ng-if="DishVM.restaurant.idu == DishVM.currentUser.id">
			<form data-ng-submit="DishVM.functions.deleteCurrentDish()">
				<label>Are you sure you want to delete this dish?</label> 
				<input type="submit" value="Yes">
			</form>
			<a href="#!/myRestaurants">No, go back</a>
		</div>
		<div data-ng-if="DishVM.restaurant.idu != DishVM.currentUser.id">
			<div class="formulario_error">
				<h2 class="fuera"> No puedes editar un plato que no es tuyo </h2>
				<a href="#!/myRestaurants">Go back</a>
			</div>
		</div>
	</div>
		
		
		
		
		<div data-ng-if = "DetailsVM.tipoBorrado == 1">
			<form data-ng-submit="DetailsVM.functions.deleteCurrentReview ()">
				<label>Are you sure you want to delete this review?</label> 
				<input type="submit" value="Yes">
			</form>
			<a data-ng-href = "#!/rateRestaurant/{{ DetailsVM.restaurant.id }}">No,go back</a>
		</div>
	</div>
</div>
