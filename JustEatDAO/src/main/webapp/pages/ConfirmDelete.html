<div class="full-screen-container">
	<div class="main-page-container">
		<c:if test="${requestScope.delete eq 0}">
			<form>
				<label>Are you sure you want to delete your account?</label> <input
					type="submit" value="Yes, delete">
			</form>
			<a href="<c:url value = 'UpdateUserServlet.do'/>">No, go back</a>
		</c:if>
		<c:if test="${requestScope.delete eq 1}">
			<form>
				<label>Are you sure you want to delete this restaurant?</label> <input
					type="submit" value="Yes, delete">
			</form>
			<a
				href="<c:url value = 'UpdateRestaurantServlet.do?idR=${resID}&idU=${user.id}'/>">No,
				go back</a>
		</c:if>
		<c:if test="${requestScope.delete eq 2}">
			<form action="DeleteDishServlet.do?id=${dishID}" method="post">
				<label>Are you sure you want to delete this dish?</label> <input
					type="submit" value="Yes, delete">
			</form>
			<a
				href="<c:url value = 'UpdateDishesServlet.do?idR=${resID}&idU=${user.id}'/>">No,
				go back</a>
		</c:if>
		<c:if test="${requestScope.delete eq 3}">
			<form>
				<label>Are you sure you want to delete this review?</label> <input
					type="submit" value="Yes, delete">
			</form>
			<a
				href="<c:url value = 'UpdateReviewServlet.do?idR=${resID}&idU=${user.id}'/>">No,
				go back</a>
		</c:if>
	</div>
</div>
