<link rel = "stylesheet" href = "../css/restaurants.css">
<div class="full-screen-container">
	<div class="main-page-container">
		<div class="restaurants-grid">
			<div data-ng-repeat = "rest in RestaurantVM.myRestaurants">
				<div class="single-restaurant">
					<a href="#!/restaurantDetails/{{ rest.id }}"><img
						data-ng-src="../images/{{ rest.restaurantPic }}" class="restaurant-photo"></a>
					<h3>{{ rest.name }}</h3>
				</div>
			</div>
			
		</div>
		<div class="add-restaurant-div">
			<a class="add-restaurant"
				href="#!/AddRestaurant">Add restaurant</a>
		</div>
		<a class="delete-link" href="#!/">Go back to main page</a>
	</div>
</div>
