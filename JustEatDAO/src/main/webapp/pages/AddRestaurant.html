<link rel = "stylesheet" href = "../css/login.css">
<link rel = "stylesheet" href = "../css/update-restaurant.css">
<div class = "full-screen-container">
 	<div class = "login-container">
    	<h1 class = "login-title">Create your restaurant</h1>
        <form class = "form" data-ng-submit = "RestaurantVM.functions.createNewRestaurant ()">
        	<div class = "input-group">
            	<label for = "name">Name</label>
                <input type = "text" name = "name" data-ng-model = "RestaurantVM.newRestaurant.name" required>
            </div>
            <div class = "input-group">
                <label for = "address">Address</label>
                <textarea name = "address" data-ng-model = "RestaurantVM.newRestaurant.address" required></textarea>
            </div>
           	<div class = "input-group">
                <label for = "telephone">Telephone</label>
                <input type = "tel" name = "telephone" data-ng-model = "RestaurantVM.newRestaurant.telephone" required>
            </div>
            <div class = "input-group">
                <label for = "city">City</label>
                <input type = "text" name = "city" data-ng-model = "RestaurantVM.newRestaurant.city" required>
            </div>
            <div class = "input-group">
                <label for = "contactEmail">Email</label>
                <input type = "email" name = "contactEmail" id = "email" data-ng-model = "RestaurantVM.newRestaurant.contactEmail" required>
            </div>
            <div class = "input-group">	
  				<label for="image">Take a picture: </label>
  				<input type = "file" id = "image" name = "image">
  				<a class = "delete-link" data-ng-href = "">Delete Picture</a>
            </div>
            <div class = "input-group">
                <h2 class = "login-title" id = "bike-parking-question">What kind of food do you serve?</h2>
                <div data-ng-repeat = "cat in RestaurantVM.allCategories">
                	<div class = "category-container">
                		<label for = "{{ cat.name }}" class = "features-text">{{ cat.name }}</label>
                		<input type = "checkbox" value = "{{ cat.name }}" name = "selectedCategory"
                			data-ng-click = "RestaurantVM.functions.markCategory (cat.id)">
                	</div>
                </div>
            </div>
            <div class = "input-group">
                <h2 class = "login-title" id = "bike-parking-question">Do you have a bike parking lot?</h2>
                <div class = "bike-friendly-checkbox">
                    <input type = "checkbox" value = "yes-bike-friendly-value" name = "bike-friendly"
                    data-ng-click = "RestaurantVM.functions.flipBike ()">
                </div>
            </div>
            <div class = "input-group">
                <h2 class = "login-title">Can you take orders?</h2>
                <div class = "available-checkbox">
                    <input type = "checkbox" value = "yes-available" name = "available"
                    data-ng-click = "RestaurantVM.functions.flipAvailable ()">
                </div>
            </div>
            <input type = "submit" class = "login-button" value = "Create restaurant">
            <a class = "delete-link" data-ng-href = "#!/myRestaurants">Go back</a>
        </form>
        <p class = error>{{ RestaurantVM.error }}</p>
	</div>
</div>
