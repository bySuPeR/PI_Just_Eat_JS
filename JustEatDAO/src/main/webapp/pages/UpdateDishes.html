<link rel = "stylesheet" href = "../css/login.css">
<link rel = "stylesheet" href = "../css/update-restaurant.css">
<link rel = "stylesheet" href = "../css/update-dishes.css">
<div class="full-screen-container">
	<div class="login-container">
		<h1 class="login-title">Manage your dishes</h1>
	 	<div class="oferta" data-ng-repeat="dish in DishVM.dishesList">
			<form class = "form">
				<div class="invidivual-dish-input">
					<div class="input-group">
						<label for="name">Name</label> 
						<input type="text" name="name" required data-ng-model="dish.name">
					</div>
					<div class="input-group">
						<label for="price">Price</label> 
						<input type="number" name="price" required data-ng-model="dish.price">
					</div>
					<div class="input-group">
						<label for="description">Description</label>
						<textarea name="description" required data-ng-model="dish.description"></textarea>
					</div>
					<div class="input-group">
						<label for="image">Take a picture: </label> 
						<input type="file" id="image" name="image"> <a class="delete-link" href="">Delete Picture</a>
					</div>
					<a class="delete-link" href="#!/deleteDish/{{ dish.id }}">Delete dish</a>
					<input type="submit" class="login-button" value="Update dish" id="update-dish">
				</div>
			</form>
		</div>
		<a id="manage-dishes-link" href="">Add new dish</a>
		<a class="delete-link" data-ng-href="#!/UpdateRestaurant/{{ DishVM.restID }}">Go back to restaurant update page</a>
		<p class = error>{{ DishVM.error }}</p>
	</div>
</div>
