<link rel = "stylesheet" href = "../css/login.css">
<link rel = "stylesheet" href = "../css/update-restaurant.css">
<div class = "full-screen-container">
	<div class = "login-container">
		<div data-ng-if = "OrderVM.newOrderRestaurant.available == 1">
			<h1 class = "login-title">Make your order</h1>
			<form class="form" data-ng-submit="OrderVM.functions.makeOrder ()">
				<div class="input-group">
					<h2 class="login-title">Select your dishes</h2>
					<div data-ng-repeat="dish in OrderVM.dishList">
						<div class="category-container">
							<label for="{{ dish.name }}" class="features-text">{{
								dish.name }}, {{ dish.price }}€</label> <input type="checkbox"
								value="{{ dish.id }}" name="selectedDish"
								data-ng-click="OrderVM.functions.addDishToOrder (dish.id)">
						</div>
					</div>
				</div>
				<input class="login-button" type="submit" value="Make order">
				<a class="delete-link" data-ng-href="#!/restaurantDetails/{{ OrderVM.newOrderRestaurant.id }}">Go back to restaurant page
				</a>
				<p class="error">{{ OrderVM.error }}</p>
			</form>
		</div>
		<div data-ng-if = "OrderVM.newOrderRestaurant.available == 0">
			<div class="formulario_error">
				<h2 class="fuera">El restaurante no acepta pedidos</h2>
				<a class="delete-link" href="#!/MyOrders">Go back</a>
			</div>
		</div>
    </div>
</div>
