<link rel = "stylesheet" href = "../css/login.css">
        <div class = "full-screen-container">
            <div class = "login-container">
                <h1 class = "login-title">Register</h1>
                <form class = "form" data-ng-submit="UserVM.functions.updateCurrentUser()">
                    <div class = "input-group">
                        <label for = "name">Name</label>
                        <input type = "text" name = "name" required data-ng-model = "UserVM.currentUser.name" >
                    </div>
                    <div class = "input-group">
                        <label for = "surname">Surname</label>
                        <input type = "text" name = "surname" required data-ng-model = "UserVM.currentUser.surname">
                    </div>
                    <div class = "input-group">
                        <label for = "email">Email</label>
                        <input type = "email" name = "email" id = "email" required data-ng-model = "UserVM.currentUser.email">
                    </div>
                    <div class = "input-group">
                        <label for = "password">Password</label>
                        <input type = "password" name = "password" id = "password" required data-ng-model = "UserVM.currentUser.password" required>
                    </div>
                    <button type = "submit" class = "login-button">Update account</button>
                    <a class = "delete-link" href = "/JustEatDAO/LogOutServlet.do">Log Out</a>
                    <a class = "delete-link" href = "">Delete account</a>
                    <a class = "delete-link" href = "">Go back to main page</a>
                </form>
                <p class = error>{{ UserVM.error }}</p>
            </div>
        </div>
