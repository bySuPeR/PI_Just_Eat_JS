<link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../css/update-restaurant.css">
<link rel="stylesheet" href="../css/update-dishes.css">
<div class="full-screen-container">
	<div class="login-container">
		<h1 class="login-title">Your orders</h1>
		<div data-ng-repeat = "order in OrderVM.myOrders">
			<form class="invidivual-dish-input" id="order-form" data-ng-submit="OrderVM.functions.loadOrder(order.id)">
				<h1>Pedido {{ $index+1 }}</h1>
				<h2>{{ order.totalPrice }}</h2>
				<input type="submit" class="login-button" value="Check it out">
			</form>
		</div>
		<a class="delete-link" href="#!/">Go back to main page</a>
	</div>
</div>
