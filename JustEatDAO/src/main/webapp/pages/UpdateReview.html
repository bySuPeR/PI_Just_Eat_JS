<link rel="stylesheet" href="../css/res_details.css">
<link rel="stylesheet" href="../css/load_review.css">
        <div class = "full-screen-container">
            <div class = "login-container">
                <h1 class = "login-title">Update your review</h1>
                <form class = "form">
                	<div class = "input-group">
                		<label for = "review">Review</label>
                        <input type = "text" name = "review" required data-ng-model = "DetailsVM.reviewUser.review">
                	</div>
                	<div class = "input-group">
                		<label for = "grade">Grade</label>
                       <input type = "range" name = "grade" min = "1.0" max = "5.0" step = "0.1" data-ng-model = "DetailsVM.reviewUser.grade">
                	</div>
                	<input type = "submit" class = "login-button" value = "Update review">
                </form>
                <a class = "delete-link" href = "#!/deleteReview/{{ DetailsVM.restaurant.id }}">Delete review</a>
                <a class = "delete-link" href = "#!/restaurantDetails/{{ DetailsVM.restaurant.id }}">Go back</a>
            </div>
        </div>
    </body>
</html>
