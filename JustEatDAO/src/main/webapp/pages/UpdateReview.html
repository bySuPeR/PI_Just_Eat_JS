<link rel="stylesheet" href="../css/res_details.css">
<link rel="stylesheet" href="../css/load_review.css">
<div class = "full-screen-container">
	<div class = "login-container">
		<div data-ng-if = "DetailsVM.currentReview.idu == DetailsVM.currentUser.id">
			<h1 class="login-title">Update your review</h1>
			<form class="form" data-ng-submit="DetailsVM.functions.updateCurrentReview ()">
				<div class="input-group">
					<label for="review">Review</label>
					<input type="text" name="review" required data-ng-model="DetailsVM.currentReview.review">
				</div>
				<div class="input-group">
					<label for="grade">Grade</label> <input type="range" name="grade"
						min="1.0" max="5.0" step="0.1"
						data-ng-model="DetailsVM.currentReview.grade">
				</div>
				<input type="submit" class="login-button" value="Update review">
			</form>
			<a class = "delete-link" href = "#!/deleteReview/{{ DetailsVM.restaurant.id }}">Delete review</a>
		</div>
       
       <div data-ng-if="DetailsVM.currentReview.idu != DetailsVM.currentUser.id">
			<div class="formulario_error">
				<h2 class="fuera"> No puedes editar una review que no es tuya </h2>
				<a href="#!/myRestaurants"></a>
			</div>
		</div>
	    <a class = "delete-link" href = "#!/loadReviews/{{ DetailsVM.restaurant.id }}">Go back</a>
    </div>
</div>
