<link rel = "stylesheet" href = "../css/login.css">
<link rel = "stylesheet" href = "../css/update-restaurant.css">
<div class = "full-screen-container">
 	<div class = "login-container">
    	<h1 class = "login-title">Update your restaurant</h1>
        <form class = "form" data-ng-submit = "DetailsVM.functions.updateCurrentRestaurant ()">
        	<div class = "input-group">
            	<label for = "name">Name</label>
                <input type = "text" name = "name" data-ng-model = "DetailsVM.restaurant.name" required>
            </div>
            <div class = "input-group">
                <label for = "address">Address</label>
                <textarea name = "address" data-ng-model = "DetailsVM.restaurant.address" required></textarea>
            </div>
           	<div class = "input-group">
                <label for = "telephone">Telephone</label>
                <input type = "tel" name = "telephone" data-ng-model = "DetailsVM.restaurant.telephone" required>
            </div>
            <div class = "input-group">
                <label for = "city">City</label>
                <input type = "text" name = "city" data-ng-model = "DetailsVM.restaurant.city" required>
            </div>
            <div class = "input-group">
                <label for = "contactEmail">Email</label>
                <input type = "email" name = "contactEmail" id = "email" data-ng-model = "DetailsVM.restaurant.contactEmail" required>
            </div>
            <div class = "input-group">	
  				<label for="image">Take a picture: </label>
  				<input type = "file" id = "image" name = "image">
  				<a class = "delete-link" data-ng-href = "">Delete Picture</a>
            </div>
            <div class = "input-group">
                <h2 class = "login-title" id = "bike-parking-question">What kind of food do you serve?</h2>
                <div data-ng-repeat = "cat in DetailsVM.allCategories">
                	<div class = "category-container">
                		<label for = "{{ cat.name }}" class = "features-text">{{ cat.name }}</label>
                		<input type = "checkbox" value = "{{ cat.name }}" name = "selectedCategory"
                			data-ng-checked = "DetailsVM.functions.isCategoryMarked (cat.name)"
                			data-ng-click = "DetailsVM.functions.markCategory (cat.name)">
                	</div>
                </div>
            </div>
            <div class = "input-group">
                <h2 class = "login-title" id = "bike-parking-question">Do you have a bike parking lot?</h2>
                <div class = "bike-friendly-checkbox">
                	<label for = "bike-friendly">Yes</label>
                    <input type = "radio" value = "yes-bike-friendly-value" name = "bike-friendly"
                    data-ng-model = "DetailsVM.isBikeFriendly"
                    data-ng-click = "DetailsVM.functions.flipBike ()"
                    id = "bike-friendly">
                </div>
                <div class = "bike-friendly-checkbox">
                	<label for = "bike-friendly">No</label>
                	<input type = "radio" value = "no-bike-friendly-value" name = "bike-friendly"
                    data-ng-model = "DetailsVM.isBikeFriendly"
                    data-ng-click = "DetailsVM.functions.flipBike ()"
                    id = "bike-friendly">
                </div>
            </div>
            <div class = "input-group">
                <h2 class = "login-title">Can you take orders?</h2>
                <div class = "available-checkbox">
                    <input type = "checkbox" value = "yes-available" name = "available"
                    data-ng-checked = "DetailsVM.isAvailable"
                    data-ng-click = "DetailsVM.functions.flipAvailable ()">
                </div>
            </div>
            <a id = "manage-dishes-link" data-ng-href = "#!/manageDishes/{{ DetailsVM.restaurant.id }}">Manage dishes</a>
            <input type = "submit" class = "login-button" value = "Update restaurant">
            <a class = "delete-link" data-ng-href = "#!/deleteRestaurant/{{ DetailsVM.restaurant.id }}">Delete restaurant</a>
            <a class = "delete-link" data-ng-href = "#!/restaurantDetails/{{ DetailsVM.restaurant.id }}">Go back to restaurant page</a>
        </form>
        <p class = error>{{ DetailsVM.error }}</p>
	</div>
</div>
