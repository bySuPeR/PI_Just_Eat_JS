<form method = "post" data-ng-submit="HostingVM.functions.filterServices ()">
	<input type = "checkbox" value = "WiFi" data-ng-click="HostingVM.functions.selectServiceCategory('WiFi', false)" class = "servCheck">
    	<label class = "servicPart">Wi-Fi</label>
    <input type = "checkbox" value = "Sport" data-ng-click="HostingVM.functions.selectServiceCategory('Sport', false)" id = "sportBox">
    	<label class = "servicPart" id = "sportName">Sport area</label>
    <input type = "checkbox" value = "Pool" data-ng-click="HostingVM.functions.selectServiceCategory('Pool', false)" id = "poolBox">
    	<label class = "servicPart" id = "poolName">Swimming pool</label>
    <input type = "submit" value = "Search" class = "servButton">
</form>
<div class="grid-container">
	<div data-ng-repeat="hosting in HostingVM.hostList">
		<figure>
			<a data-ng-href = "#!/Details/{{ hosting.id }}">
				<img data-ng-src="../images/{{ hosting.foto }}" alt = "House picture" class = "hostPicture">
			</a>
			<p>{{ hosting.title }}</p>
			<p id = "location">{{ hosting.location }}</p>
			<p id = "precio">{{ hosting.precio }}€/noche</p>
			<p id = heart>&hearts;</p>
			<p id = "likes">{{ hosting.likes }}</p>
		</figure>
	</div>
</div>
