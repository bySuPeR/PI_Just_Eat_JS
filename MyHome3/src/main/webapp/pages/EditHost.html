<div data-ng-if="DetailsVM.currentUser != null && DetailsVM.host.idu == DetailsVM.currentUser.id">
	<div class = "hostForm">
   		<form method = "post" class = form data-ng-submit="DetailsVM.functions.editHost ()">
   			<label for="hostNameFor">Name</label>
	   		<input type = "text" data-ng-model="DetailsVM.host.title" id="hostNameFor" required><br>
	   		<label for="hostDescripcionFor" class = "descriptionPart">Description</label>
	   		<textarea data-ng-model="DetailsVM.host.description" class = "descriptionPart" rows="1" cols="25" required></textarea><br>
	   		<label for="hostPhoneFor" class = "phonePart">Phone number</label>
	   		<input type = "tel" data-ng-model="DetailsVM.host.telephone" class = "phonePart" required><br>
	   		<label for="hostEmailFor" class = "emailPart">E-mail</label>
	   		<input type = "email" data-ng-model="DetailsVM.host.contactEmail" class = "emailPart" required><br>
	   		<label for="hostPriceFor" class = "pricePart">Price</label>
   			<input type = "number" data-ng-model="DetailsVM.host.precio" class = "pricePart" required><br>
   			<label class = "catPart">Category: </label><br>
   			<input type = "checkbox" value = "Apartments" name = "hostCategory" class = "catPart"
   				data-ng-checked="DetailsVM.categoryList.indexOf ('Apartments') > -1" data-ng-click="DetailsVM.functions.selectServiceCategory ('Apartments', true)">
   				<label class = "catPart">Apartments</label><br>
   			<input type = "checkbox" value = "Townhomes" name = "hostCategory" class = "catPart"
   				data-ng-checked="DetailsVM.categoryList.indexOf ('Townhomes') > -1" data-ng-click="DetailsVM.functions.selectServiceCategory ('Townhomes', true)">
   				<label class = "catPart">Townhomes</label><br>
   			<input type = "checkbox" value = "TinyHome" name = "hostCategory" class = "catPart"
   				data-ng-checked="DetailsVM.categoryList.indexOf ('TinyHome') > -1" data-ng-click="DetailsVM.functions.selectServiceCategory ('TinyHome', true)">
   				<label class = "catPart">Tiny Home</label><br>
   			<input type = "checkbox" value = "ColonialStyle" name = "hostCategory" class = "catPart"
   				data-ng-checked="DetailsVM.categoryList.indexOf ('ColonialStyle') > -1" data-ng-click="DetailsVM.functions.selectServiceCategory ('ColonialStyle', true)">
   				<label class = "catPart">Colonial Style</label><br>
   			<label for="hostLocationFor" class = "locPart">Location</label>
   			<input type = "text" data-ng-model="DetailsVM.host.location" class = "locPart" required><br>
   			<label class = "servicPartAdd">Services: </label><br>
   			<input type = "checkbox" value = "WiFi" name="hostServices" class = "servicPartAdd"
   				data-ng-checked="DetailsVM.serviceList.indexOf ('WiFi') > -1" data-ng-click="DetailsVM.functions.selectServiceCategory ('WiFi', false)">
  				<label class = "servicPartAdd">Wi-Fi</label><br>
	   		<input type = "checkbox" value = "Sport" name="hostServices" class = "servicPartAdd"
	   			data-ng-checked="DetailsVM.serviceList.indexOf ('Sport') > -1" data-ng-click="DetailsVM.functions.selectServiceCategory ('Sport', false)">
   				<label class = "servicPartAdd">Sport area</label><br>
   			<input type = "checkbox" value = "Pool" name="hostServices" class = "servicPartAdd"
   				data-ng-checked="DetailsVM.serviceList.indexOf ('Pool') > -1" data-ng-click="DetailsVM.functions.selectServiceCategory ('Pool', false)">
   				<label class = "servicPartAdd">Swimming pool</label><br>
   			<input type = "submit" value = "Edit host" id = "addHostButton">
   		</form>
   		<p id="error"></p>
	</div>
</div>
<div data-ng-if="DetailsVM.currentUser == null || DetailsVM.host.idu != DetailsVM.currentUser.id">
	<div class = "notAvailable">
		<h1 id = "hNotAvailable">This host is not available</h1>
	</div>
</div>
