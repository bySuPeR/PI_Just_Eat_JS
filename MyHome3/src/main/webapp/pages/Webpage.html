<form method = "post" data-ng-submit="HostingVM.functions.searchNameDescription ()">
	<input type = "text" class = "nameDescriptionText" name = "search" placeholder = "Type name, description or location" data-ng-model="HostingVM.nameDescription" required>
    <input type = "submit" class = "nameDescriptionButton" value = "Search">
</form>
<form method = "post" data-ng-submit="HostingVM.functions.searchHostByCategory ()">
    <select data-ng-model="HostingVM.pickedCategory" id="categorySelect">
    	<option value = "Apartments">Apartments</option>
    	<option value = "Townhomes">Townhomes</option>
    	<option value = "TinyHome">TinyHome</option>
    	<option value = "ColonialStyle">ColonialStyle</option>
    </select>
	<input type = "submit" value = "Search" id = "categorySearch">
</form>
<p id = "priceWord">Max price:</p>
<form method = "post" data-ng-submit="HostingVM.functions.searchHostByPrice ()">
	<input type = "range" min = "1" max = "1500" value = "1500" data-ng-model="HostingVM.selectedPrice" oninput="this.nextElementSibling.value = this.value">
    <input type = "submit" value = "Search" id = "priceRangeSearch">
</form>
<div class="grid-container">
	<div data-ng-repeat="hosting in HostingVM.hostList">
		<figure>
			<a data-ng-href = "#!/Details/{{ hosting.id }}">
				<img data-ng-src="../images/{{ hosting.foto }}" alt = "House picture" class = "hostPicture">
			</a>
			<p>{{ hosting.title }}</p>
			<p id = "location">{{ hosting.location }}</p>
			<p id = "precio">{{ hosting.precio }}€/noche</p>
			<p id = heart>&hearts;</p>
			<p id = "likes">{{ hosting.likes }}</p>
		</figure>
	</div>
</div>
