<form method = "post" data-ng-submit="HostingVM.functions.reverseFavouritesOrder ()">
	<label id = "reverseLabel">Reverse order</label>
    <input type = "submit" value = "&#8634" id = "likesFilterButton">
</form>
<div class="grid-container">
	<div data-ng-repeat="hosting in HostingVM.hostList">
		<figure>
			<a data-ng-href = "#!/Details/{{ hosting.id }}">
				<img data-ng-src="../images/{{ hosting.foto }}" alt = "House picture" class = "hostPicture">
			</a>
			<p>{{ hosting.title }}</p>
			<p id = "location">{{ hosting.location }}</p>
			<p id = "precio">{{ hosting.precio }}€/noche</p>
			<p id = heart>&hearts;</p>
			<p id = "likes">{{ hosting.likes }}</p>
		</figure>
	</div>
</div>
