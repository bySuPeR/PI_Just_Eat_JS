<div data-ng-if="DetailsVM.currentUser != null && DetailsVM.host.idu == DetailsVM.currentUser.id">
	<form class = "deleteForm" method = "post" data-ng-submit="DetailsVM.functions.deleteHost(DetailsVM.host.id)">
   		<h1 class = "deleteHostText">Would you like to delete this host?</h1>
   		<input type = "submit" value = "Yes, I would" class = "deleteHostButtonPage">
	</form>
</div>
<div data-ng-if="DetailsVM.currentUser == null || DetailsVM.host.idu != DetailsVM.currentUser.id">
	<div class = "notAvailable">
		<h1 id = "hNotAvailable">This host is not available</h1>
	</div>
</div>
