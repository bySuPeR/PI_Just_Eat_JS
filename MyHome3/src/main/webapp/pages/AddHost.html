<div class = "hostForm">
	<form method = "post" data-ng-submit="HostingVM.functions.addNewHost ()" class = form>
    	<label for="hostNameFor">Name</label>
    	<input type = "text" data-ng-model="HostingVM.host.title" id="hostNameFor" required><br>
   		<label for="hostDescripcionFor" class = "descriptionPart">Description</label>
   		<textarea data-ng-model="HostingVM.host.description" class = "descriptionPart" rows="1" cols="25" required></textarea><br>
   		<label for="hostPhoneFor" class = "phonePart">Phone number</label>
   		<input type = "tel" data-ng-model="HostingVM.host.telephone" class = "phonePart" required><br>
   		<label for="hostEmailFor" class = "emailPart">E-mail</label>
   		<input type = "email" data-ng-model="HostingVM.host.contactEmail" class = "emailPart" required><br>
   		<label for="hostPriceFor" class = "pricePart">Price</label>
   		<input type = "number" data-ng-model="HostingVM.host.precio" class = "pricePart" required><br>
   		<label class = "catPart">Category: </label><br>
   		<input type = "checkbox" value = "Apartments" name = "hostCategory" class = "catPart"
   			data-ng-checked="HostingVM.selectedCategories.indexOf ('Apartments') > -1" data-ng-click="HostingVM.functions.selectServiceCategory ('Apartments', true)">
   		<label class = "catPart">Apartments</label><br>
   		<input type = "checkbox" value = "Townhomes" name = "hostCategory" class = "catPart"
   			data-ng-checked="HostingVM.selectedCategories.indexOf ('Townhomes') > -1" data-ng-click="HostingVM.functions.selectServiceCategory ('Townhomes', true)">
   		<label class = "catPart">Townhomes</label><br>
   		<input type = "checkbox" value = "TinyHome" name = "hostCategory" class = "catPart"
   			data-ng-checked="HostingVM.selectedCategories.indexOf ('TinyHome') > -1" data-ng-click="HostingVM.functions.selectServiceCategory ('TinyHome', true)">
   		<label class = "catPart">Tiny Home</label><br>
   		<input type = "checkbox" value = "ColonialStyle" name = "hostCategory" class = "catPart"
   			data-ng-checked="HostingVM.selectedCategories.indexOf ('ColonialStyle') > -1" data-ng-click="HostingVM.functions.selectServiceCategory ('ColonialStyle', true)">
   		<label class = "catPart">Colonial Style</label><br>
   		<label for="hostLocationFor" class = "locPart">Location</label>
   		<input type = "text" data-ng-model="HostingVM.host.location" class = "locPart" required><br>
   		<label class = "servicPartAdd">Services: </label><br>
   		<input type = "checkbox" value = "WiFi" name="hostServices" class = "servicPartAdd"
   			data-ng-checked="HostingVM.selectedServices.indexOf ('WiFi') > -1" data-ng-click="HostingVM.functions.selectServiceCategory ('WiFi', false)">
   		<label class = "servicPartAdd">Wi-Fi</label><br>
   		<input type = "checkbox" value = "Sport" name="hostServices" class = "servicPartAdd"
   			data-ng-checked="HostingVM.selectedServices.indexOf ('Sport') > -1" data-ng-click="HostingVM.functions.selectServiceCategory ('Sport', false)">
   		<label class = "servicPartAdd">Sport area</label><br>
   		<input type = "checkbox" value = "Pool" name="hostServices" class = "servicPartAdd"
   			data-ng-checked="HostingVM.selectedServices.indexOf ('Pool') > -1" data-ng-click="HostingVM.functions.selectServiceCategory ('Pool', false)">
   		<label class = "servicPartAdd">Swimming pool</label><br>
   		<input type = "submit" value = "Add host" id = "addHostButton">
    	</form>
    <p id="error"></p>
</div>
